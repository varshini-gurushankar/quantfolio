[project]
name = "quantfolio"
version = "0.1.0"
description = "Point-in-time-correct market data platform and quantitative research stack"
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=15.0",
    # Airflow 2.10 pins SQLAlchemy to the 1.4 line, so the floor stays there and
    # the storage layer sticks to API that exists in both 1.4 and 2.x. The API
    # container resolves to 2.x; the Airflow image keeps 1.4. Requiring >=2.0
    # here would make `pip install` inside the Airflow image break Airflow.
    "sqlalchemy>=1.4.36",
    "psycopg2-binary>=2.9",
    "boto3>=1.34",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "yfinance>=0.2.40",
    "requests>=2.31",
    "pandas-market-calendars>=4.4",
    "prometheus-client>=0.20",
    "tenacity>=8.2",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
ml = [
    "torch>=2.2",
    "tensorflow>=2.16; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "tensorflow-macos>=2.16; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "scikit-learn>=1.4",
    "cvxpy>=1.4",
    "mlflow>=2.12",
]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "moto[s3]>=5.0",
    "ruff>=0.4",
    "locust>=2.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantfolio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "integration: requires live Postgres/LocalStack (deselect with -m 'not integration')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 flags function calls in argument defaults, which is precisely how FastAPI
# declares Depends() and Query() parameters.
ignore = ["B008"]
