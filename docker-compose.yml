name: quantfolio

# Shared Airflow configuration. LocalExecutor keeps the stack to one scheduler
# process with real parallelism — no Redis or Celery workers to run for a
# pipeline whose tasks are minutes long, not hours.
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/Dockerfile.airflow
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-quantfolio}:${POSTGRES_PASSWORD:-quantfolio}@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
    PYTHONPATH: /opt/quantfolio/src
    # Project settings, read by quantfolio.config.Settings
    POSTGRES_USER: ${POSTGRES_USER:-quantfolio}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quantfolio}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB:-quantfolio}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    S3_ENDPOINT_URL: http://localstack:4566
    S3_RAW_BUCKET: ${S3_RAW_BUCKET:-quantfolio-raw}
    S3_ARTIFACTS_BUCKET: ${S3_ARTIFACTS_BUCKET:-quantfolio-artifacts}
    PUSHGATEWAY_URL: http://pushgateway:9091
    ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
    UNIVERSE_PATH: /opt/quantfolio/config/universe.yml
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/quantfolio/src
    - ./config:/opt/quantfolio/config
    - ./logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy
    localstack:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quantfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quantfolio}
      POSTGRES_DB: ${POSTGRES_DB:-quantfolio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quantfolio}"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3.5
    environment:
      SERVICES: s3
      DEBUG: "0"
      S3_RAW_BUCKET: ${S3_RAW_BUCKET:-quantfolio-raw}
      S3_ARTIFACTS_BUCKET: ${S3_ARTIFACTS_BUCKET:-quantfolio-artifacts}
    volumes:
      - ./docker/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
      - localstack_data:/var/lib/localstack
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3 ls | grep -q quantfolio-raw"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # One-shot: migrates the Airflow metadata DB, creates the admin user, and
  # creates the project tables. Every other Airflow service waits on it.
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER:-airflow}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:-airflow}" \
          --firstname Quant --lastname Folio --role Admin \
          --email admin@quantfolio.local || true
        python -c "from quantfolio.storage.db import create_all; create_all()"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quantfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quantfolio}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-quantfolio}
      UNIVERSE_PATH: /app/config/universe.yml
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Airflow tasks are ephemeral, so Prometheus cannot scrape them. They push
  # here on completion and Prometheus scrapes the gateway instead.
  pushgateway:
    image: prom/pushgateway:v1.9.0
    ports:
      - "9091:9091"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - pushgateway
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      # Dashboards are provisioned from files in the repo, not clicked together
      # in the UI, so the dashboard is reviewable and survives a volume wipe.
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  localstack_data:
  prometheus_data:
  grafana_data:
